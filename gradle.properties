org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.daemon=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
kotlin.code.style=official
# NOTE: The following line is sandbox-specific (bundled x86_64 aapt2 -> aarch64 via QEMU).
# It must be DISABLED on normal x86_64 / arm64 machines, otherwise the build will fail
# because that path does not exist. Default AGP aapt2 is used when this is commented out.
# android.aapt2FromMavenOverride=/opt/android-dev/aapt2-override/aapt2
