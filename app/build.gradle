plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Load signing config from local.properties (never committed to git)
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('local.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.aegis.guard'
    compileSdk 35

    defaultConfig {
        applicationId "com.aegis.guard"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        vectorDrawables.useSupportLibrary = true
    }

    // Whether a release keystore is configured via local.properties
    def hasSigning = keystorePropsFile.exists() && keystoreProps['signing.storeFile'] != null

    signingConfigs {
        release {
            if (hasSigning) {
                storeFile = file(keystoreProps['signing.storeFile'])
                storePassword = keystoreProps['signing.storePassword']
                keyAlias = keystoreProps['signing.keyAlias']
                keyPassword = keystoreProps['signing.keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Only sign if a keystore is configured; otherwise produces an unsigned APK.
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.fragment:fragment-ktx:1.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.google.code.gson:gson:2.10.1'

    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib:1.9.24') {
            because 'unify kotlin-stdlib to avoid duplicate classes'
        }
    }
}
